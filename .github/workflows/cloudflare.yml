name: Cloudflare 门禁

on:
  push:
    branches:
      - main
      # 本分支自身也要触发门禁：此前只限定 main，导致推送到 cloudflare 分支
      # 从不运行云部门禁（推送历史零运行记录）。分支在被合回 main 之前，
      # 其 WASM 构建与 SQL 实证只能在推送时由本工作流独立验证。
      - cloudflare
    paths:
      - "cloudflare/**"
      # workflow 文件本身的变更也要触发，否则触发器改动无法被验证
      - ".github/workflows/cloudflare.yml"
  pull_request:
    paths:
      - "cloudflare/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与主 CI 保持一致，禁止自动下载其它 Go 工具链。
  GOTOOLCHAIN: local

jobs:
  verify:
    name: 格式 / 静态检查 / WASM 构建 / 单测
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./cloudflare
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          # defaults.run 不影响 Action，版本文件路径从仓库根目录解析。
          go-version-file: go.mod
          cache: false

      - name: gofmt 检查
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未通过 gofmt，请在 cloudflare/ 下执行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        env:
          GOOS: js
          GOARCH: wasm
        run: go vet ./...

      - name: 构建 WASM
        env:
          GOOS: js
          GOARCH: wasm
        run: go build ./...

      - name: 运行单元测试
        run: go test ./...

      # d1sqltest 是独立 module，不会被上一步的 ./... 递归到，必须显式跑。
      # 它是 CF 版最关键的一批证据：用真实 migration 建表，实证取码语句
      # UPDATE ... RETURNING 在并发下只有一个请求能取走同一验证码。
      - name: 运行 SQL 语义实证（独立 module）
        run: go test -race ./...
        working-directory: ./cloudflare/d1sqltest
