# docs/ → GitHub Wiki 单向同步：仓库 docs/ 是唯一事实源，Wiki 是自动生成的只读镜像。
# 设计依据 docs/WIKI-ARCHITECTURE.md，同步逻辑见 scripts/sync-wiki.sh。
#
# 前置条件（一次性）：在 GitHub 网页端创建 Wiki 的第一个页面，以初始化 .wiki.git 后端。
# 未初始化时同步脚本会打印指引并以 0 退出（SKIP），不会让流水线长时间飘红。
name: Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/sync-wiki.sh'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  # 推送 .wiki.git 仓库需要仓库写权限；实测 GITHUB_TOKEN 即可，无需 PAT 或 deploy key。
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    name: 同步 docs 到 Wiki
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # 不让 checkout 的凭据长期驻留在 git 配置里：脚本自行用 GH_TOKEN 注入 wiki 远端地址
          persist-credentials: false

      - name: 同步 docs 到 Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/sync-wiki.sh
